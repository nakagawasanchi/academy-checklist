<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>配信前チェックリスト</title>
<style>
:root{
  --navy:#12293b; --navy2:#0e2433; --gold:#c9a54e; --gold-l:#f0d9a0; --gold-d:#a67c2e;
  --bg:#f7f4ec; --card:#ffffff; --ink:#1b2a38; --muted:#8a8271; --done:#9aa5ad;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:linear-gradient(170deg,var(--navy2),#081220);color:var(--gold-l);
 padding:22px 18px 16px;text-align:center;position:sticky;top:0;z-index:10;
 box-shadow:0 2px 12px rgba(0,0,0,.25)}
header h1{font-size:19px;font-weight:800;letter-spacing:.08em}
.progress-wrap{margin-top:10px;background:rgba(255,255,255,.15);border-radius:99px;height:10px;overflow:hidden}
.progress{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:99px;transition:width .25s}
.pct{font-size:12px;margin-top:5px;color:#cbbd97;font-weight:700}
main{max-width:560px;margin:0 auto;padding:14px}
section{margin-top:18px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--navy);
 padding:4px 2px 8px;letter-spacing:.04em}
.sec-title .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.sec-title::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--gold)}
ul{list-style:none}
li{background:var(--card);border:1px solid #e2ddd0;border-radius:12px;margin-bottom:8px;
 box-shadow:0 1px 3px rgba(0,0,0,.05)}
label{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer;user-select:none}
input[type=checkbox]{appearance:none;flex:0 0 26px;width:26px;height:26px;border:2.5px solid var(--gold);
 border-radius:8px;background:#fff;margin-top:1px;position:relative}
input[type=checkbox]:checked{background:linear-gradient(160deg,var(--gold-l),var(--gold) 60%,var(--gold-d));border-color:var(--gold-d)}
input[type=checkbox]:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;color:#241a05;font-weight:900;font-size:17px}
.txt{font-size:15px;font-weight:700;line-height:1.55}
.txt small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5}
li:has(input:checked){opacity:.55}
li:has(input:checked) .txt{text-decoration:line-through;text-decoration-color:var(--done);color:var(--done)}
.warn{background:#fdf3f2;border:1.5px solid #dba49c;border-radius:12px;padding:14px;margin-top:18px}
.warn h2{font-size:14px;font-weight:800;color:#b0463c;margin-bottom:6px}
.warn ol{padding-left:20px;font-size:13.5px;line-height:1.9;font-weight:600}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(247,244,236,.95);backdrop-filter:blur(6px);
 border-top:1px solid #e2ddd0;padding:10px 14px;display:flex;gap:10px;max-width:100%}
footer button{flex:1;font-size:15px;font-weight:800;padding:12px;border-radius:12px;border:none;font-family:inherit}
#reset{background:#fff;border:2px solid var(--navy);color:var(--navy)}
#done-msg{flex:2;background:linear-gradient(160deg,var(--gold-l),var(--gold) 60%,var(--gold-d));color:#241a05;display:none}
.credit{text-align:center;font-size:11px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<header>
  <h1>🎹 Jazz-Steps Academy 配信前チェック</h1>
  <div class="progress-wrap"><div class="progress" id="bar"></div></div>
  <div class="pct" id="pct">0 / 0</div>
</header>

<main>

<section>
  <div class="sec-title">起動（開始60分前まで）<span class="cnt"></span></div>
  <ul>
    <li><label><input type="checkbox"><span class="txt">Macを再起動した<small>スリープ明け・つけっぱなしのまま始めない（フリーズの主因）</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">再起動後にOBSを起動し直した<small>昨日から開きっぱなしのOBSは使わない</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">電源（PD給電）がMacに来ている</span></label></li>
    <li><label><input type="checkbox"><span class="txt">有線LANで接続されている<small>メニューバーで確認。Wi-Fiに落ちていないか</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">Macの通知をオフ（集中モード）<small>配信画面に通知が映り込まない</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">ストレージ空き容量OK<small>録画1時間で数十GB。20GB以上の空きを確認</small></span></label></li>
  </ul>
</section>

<section>
  <div class="sec-title">映像・音声（開始30分前まで）<span class="cnt"></span></div>
  <ul>
    <li><label><input type="checkbox"><span class="txt">講師カメラがプレビューに映っている</span></label></li>
    <li><label><input type="checkbox"><span class="txt">ピアノカメラがプレビューに映っている<small>画角・ピントも確認</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">マイクのメーターが振れる<small>ミュート解除を忘れずに</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">ピアノの音のメーターが振れる</span></label></li>
    <li><label><input type="checkbox"><span class="txt">エンコーダが「Apple VT ハードウェア」になっている<small>設定→出力。x264のままにしない</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">オープニング動画を一度再生して音が出る<small>詰まる場合はここで発覚させる</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">メディア・BGMソースのモニタリングがオフ<small>オーディオの詳細プロパティで確認</small></span></label></li>
  </ul>
</section>

<section>
  <div class="sec-title">シーン・操作（開始15分前まで）<span class="cnt"></span></div>
  <ul>
    <li><label><input type="checkbox"><span class="txt">全シーンを一巡して表示確認<small>講師／講義+講師／講義+鍵盤／鍵盤+講師／動画／注意事項</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">講義画面のキャプチャが正しいページを映している</span></label></li>
    <li><label><input type="checkbox"><span class="txt">Stream Deckでシーン切替が動く<small>終了・配信停止系ボタンの誤爆位置もチェック</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">配信システム側に授業が正しい時刻で作成されている</span></label></li>
  </ul>
</section>

<section>
  <div class="sec-title">配信開始（開始10分前）<span class="cnt"></span></div>
  <ul>
    <li><label><input type="checkbox"><span class="txt">「注意事項」シーンにして配信開始</span></label></li>
    <li><label><input type="checkbox"><span class="txt">録画も開始した<small>配信が落ちてもアーカイブを残す保険</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">受講生側アプリ（スマホ）で映像と音を実確認<small>声・ピアノの音量バランス、遅延の程度</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">iPhoneテザリング（予備回線）を準備した</span></label></li>
    <li><label><input type="checkbox"><span class="txt">オプチャを開いた端末を手元に置いた<small>トラブル報告の監視用</small></span></label></li>
    <li><label><input type="checkbox"><span class="txt">飲み物OK・スマホはマナーモード</span></label></li>
  </ul>
</section>

<section>
  <div class="sec-title">終了後<span class="cnt"></span></div>
  <ul>
    <li><label><input type="checkbox"><span class="txt">配信停止 → 録画停止</span></label></li>
    <li><label><input type="checkbox"><span class="txt">OBSを終了した<small>開きっぱなしでスリープさせない（今日の教訓）</small></span></label></li>
  </ul>
</section>

<div class="warn">
  <h2>⚠️ 配信中にフリーズしたら</h2>
  <ol>
    <li>すぐ再起動しない。まず10秒待つ（復帰することが多い）</li>
    <li>ダメなら「講師」シーン（画面キャプチャなし）に切り替えて逃がす</li>
    <li>それでもダメな場合のみOBSを再起動する</li>
  </ol>
</div>

<div class="credit">Jazz-Steps Academy 運営｜チェックはリロードでリセットされます</div>
</main>

<footer>
  <button id="reset">リセット</button>
  <button id="done-msg">✨ 全チェック完了！良い配信を！</button>
</footer>

<script>
const boxes = [...document.querySelectorAll('input[type=checkbox]')];
const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
const doneMsg = document.getElementById('done-msg');

function update(){
  const total = boxes.length;
  const done = boxes.filter(b => b.checked).length;
  bar.style.width = (done/total*100) + '%';
  pct.textContent = done + ' / ' + total;
  doneMsg.style.display = (done === total) ? 'block' : 'none';
  document.querySelectorAll('section').forEach(sec => {
    const bs = [...sec.querySelectorAll('input')];
    const c = sec.querySelector('.cnt');
    if (c) c.textContent = bs.filter(b=>b.checked).length + '/' + bs.length;
  });
}
boxes.forEach(b => b.addEventListener('change', update));
document.getElementById('reset').addEventListener('click', () => {
  boxes.forEach(b => b.checked = false); update();
});
update();
</script>
</body>
</html>
