<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17603d">
<title>配信チェックリスト（さよ先生）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c42332;--red2:#a51a28;--green:#17603d;--green2:#1f8a4c;--gold:#f2b705;--cream:#fffaf0;
  --ink:#3b2a22;--mute:#8a6f5c;--line:#f0dcc8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--red)}
body{
  min-height:100vh;color:var(--ink);line-height:1.55;-webkit-tap-highlight-color:transparent;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background-color:var(--red);
  background-image:
    radial-gradient(rgba(255,255,255,.13) 2px,transparent 2.6px),
    radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 2px);
  background-size:34px 34px,34px 34px;background-position:0 0,17px 17px;
  overflow-x:hidden;
}

/* ---------- 雪 ---------- */
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;filter:blur(.4px);animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-20px,0)}
  50%{transform:translate3d(var(--dx),50vh,0)}
  100%{transform:translate3d(0,105vh,0)}
}

/* ---------- 上の飾り（タイトル＋ツリー） ---------- */
.hero{position:relative;z-index:1;padding:22px 16px 6px}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.merry{font-family:"Mountains of Christmas",cursive;font-weight:700;color:var(--gold);font-size:30px;line-height:1;
  text-shadow:0 2px 0 var(--red2),0 0 14px rgba(255,220,120,.35);letter-spacing:.02em}
h1{color:#fff;font-weight:900;font-size:clamp(20px,6vw,32px);white-space:nowrap;line-height:1.25;margin-top:8px;text-shadow:0 3px 0 rgba(120,10,20,.45)}
.who{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#fff;color:var(--red);font-weight:900;font-size:15px;
  padding:4px 14px 4px 10px;border-radius:99px;box-shadow:0 3px 0 rgba(120,10,20,.35)}
.who svg{width:18px;height:18px}
.tree{flex:0 0 auto;width:124px;height:auto;overflow:visible}
.trunk{fill:#8a5a3b}
.tier{fill:var(--green2);stroke:var(--green2);stroke-width:10;stroke-linejoin:round}
.tier.d{fill:#1a7a43;stroke:#1a7a43}
.wire{fill:none;stroke:#f6d77a;stroke-width:1.6;opacity:.75}
.lt{fill:#0f4a2c;stroke:rgba(255,255,255,.35);stroke-width:1;transition:fill .3s}
.lt.on{fill:var(--c);stroke:#fff;stroke-width:1.2;filter:url(#glow);animation:blink 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.star{fill:#f3e3b0;opacity:.75;transition:all .4s;transform-origin:100px 24px}
.tree.all .star{fill:#ffd23f;opacity:1;filter:url(#glow);animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(8deg)}}
.yay{display:none;max-width:760px;margin:12px auto 0;text-align:center}
.yay span{display:inline-block;background:#fff;color:var(--red);font-weight:900;font-size:17px;padding:10px 22px;border-radius:99px;
  box-shadow:0 4px 0 rgba(120,10,20,.35);animation:bounce 1.2s ease-in-out infinite}
.hero.all .yay{display:block}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- 進み具合のバー（上に固定） ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--green);padding:12px 16px 12px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.track{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.fill{height:100%;width:0;border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.6,1);
  background:repeating-linear-gradient(-45deg,#e8304a 0 9px,#fff 9px 18px);background-size:25.5px 25.5px;animation:cane 1.2s linear infinite}
@keyframes cane{to{background-position:25.5px 0}}
.pct{color:#fff;font-weight:900;font-size:16px;min-width:62px;text-align:right}
.reset{border:none;background:#fff;color:var(--green);font:inherit;font-size:13px;font-weight:900;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.2)}
.reset.arm{background:#ffd23f;color:var(--red2)}
.lights{position:absolute;left:0;right:0;bottom:-15px;height:18px;overflow:hidden;pointer-events:none;
  display:flex;justify-content:space-around}
.lights::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#0d3d25}
.bulb{position:relative;flex:0 0 auto;width:9px;height:13px;margin-top:2px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;
  background:var(--c);box-shadow:0 0 7px var(--c);animation:blink 1.8s ease-in-out infinite;animation-delay:var(--d)}
.bulb::before{content:"";position:absolute;left:2px;top:-2px;width:5px;height:4px;border-radius:1px;background:#2b4a38}

/* ---------- 本体 ---------- */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 16px 10px}
.card{position:relative;margin-top:22px;background:var(--cream);border:3px solid #fff;border-radius:24px;padding:14px 14px 4px;
  box-shadow:0 8px 0 rgba(110,8,20,.3)}
.card:first-child{margin-top:8px}
.holly{position:absolute;right:14px;top:-19px;width:52px;height:30px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px}
.tag{display:inline-flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;background:var(--c);color:#fff;font-weight:900;font-size:16px;
  padding:6px 16px 6px 8px;border-radius:10px 99px 99px 10px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tag i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--c);font-size:14px}
.cnt{flex:0 0 auto;font-weight:900;font-size:14px;color:var(--mute);background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.sh.done .cnt{background:var(--c);border-color:var(--c);color:#fff}
ul{list-style:none}
li{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-top:2px dotted var(--line);cursor:pointer;user-select:none;border-radius:10px}
li:first-child{border-top:none}
li:active{background:rgba(196,35,50,.06)}
.orn{flex:0 0 34px;width:34px;height:38px;margin-top:-4px}
.orn .ball{fill:#fff;stroke:var(--c);stroke-width:3;stroke-dasharray:5 4;transition:fill .2s}
.orn .shine,.orn .ck{opacity:0;transition:opacity .2s}
li.on .orn .ball{fill:var(--c);stroke:none}
li.on .orn .shine,li.on .orn .ck{opacity:1}
li.pop .orn{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.t{font-size:16px;font-weight:700;padding-top:2px}
li.on .t{color:#b9a596;text-decoration:line-through;text-decoration-color:var(--c);text-decoration-thickness:1.5px}
.n{display:block;font-size:13px;color:var(--mute);margin-top:3px;font-weight:500}
li.on .n{color:#c9b8aa}
.n.warn{color:#c2410c}

/* 困ったとき */
details{position:relative;margin-top:26px;background:#fff;border:3px solid #fff;border-radius:24px;box-shadow:0 8px 0 rgba(110,8,20,.3);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:900;color:var(--green);font-size:17px;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary svg{width:30px;height:30px;flex:0 0 auto}
summary .pm{margin-left:auto;color:var(--red);font-size:20px}
details[open] .pm{transform:rotate(45deg)}
.tr{padding:0 16px 14px}
.tr div{padding:12px 0;border-top:2px dotted var(--line)}
.tr b{display:block;font-size:15px;margin-bottom:3px;color:var(--red2)}
.tr p{font-size:14px}

/* 下の雪の丘 */
.ground{position:relative;z-index:1;margin-top:30px}
.ground svg{display:block;width:100%;height:110px}
.foot{background:#fff;color:var(--mute);font-size:12px;text-align:center;padding:4px 16px calc(26px + env(safe-area-inset-bottom));font-weight:700}
.err{margin-top:40px;text-align:center;color:#fff;font-weight:700}

@media (min-width:600px){
  .tree{width:190px}
  .merry{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  .flake,.lt.on,.bulb,.fill,.tree.all .star,.yay span{animation:none!important}
}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>

<div class="hero" id="hero">
  <div class="hero-in">
    <div>
      <div class="merry">Merry Christmas</div>
      <h1 id="title">配信チェックリスト</h1>
      <div class="who" id="who"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.3 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#f2b705"/></svg><span>さよ先生</span></div>
    </div>
    <svg class="tree" id="tree" viewBox="0 0 200 240" aria-hidden="true">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect class="trunk" x="88" y="196" width="24" height="26" rx="4"/>
      <path class="tier d" d="M100 112 L30 198 L170 198 Z"/>
      <path class="tier" d="M100 70 L46 146 L154 146 Z"/>
      <path class="tier d" d="M100 34 L62 96 L138 96 Z"/>
      <g id="wires"></g>
      <g id="lights"></g>
      <g transform="translate(40 206)"><rect width="30" height="24" rx="3" fill="#2f6fd0"/><rect x="12" width="6" height="24" fill="#ffd23f"/><rect y="9" width="30" height="6" fill="#ffd23f"/></g>
      <g transform="translate(128 210)"><rect width="34" height="20" rx="3" fill="#ff8fb8"/><rect x="14" width="6" height="20" fill="#fff"/><rect y="7" width="34" height="6" fill="#fff"/></g>
      <path class="star" id="star"/>
    </svg>
  </div>
  <div class="yay"><span>ぜんぶ準備OK！いい配信を！</span></div>
</div>

<div class="bar">
  <div class="bar-in"><div class="track"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0 / 0</div><button class="reset" id="reset">すべてリセット</button></div>
  <div class="lights" id="bulbs" aria-hidden="true"></div>
</div>

<div class="wrap" id="main"></div>

<div class="ground" aria-hidden="true">
  <svg viewBox="0 0 400 110" preserveAspectRatio="none">
    <path d="M0 70 Q60 30 130 62 T260 56 T400 48 L400 110 L0 110Z" fill="#fff"/>
    <g transform="translate(320 6)">
      <circle cx="20" cy="56" r="20" fill="#fff" stroke="#e7e2dc" stroke-width="2"/>
      <circle cx="20" cy="26" r="14" fill="#fff" stroke="#e7e2dc" stroke-width="2"/>
      <circle cx="15" cy="23" r="1.8" fill="#3b2a22"/><circle cx="25" cy="23" r="1.8" fill="#3b2a22"/>
      <path d="M20 28 l9 2 -9 2z" fill="#f08a24"/>
      <path d="M8 36 Q20 42 32 36 L33 40 Q20 46 7 40Z" fill="#c42332"/>
      <rect x="9" y="6" width="22" height="6" rx="2" fill="#17603d"/><rect x="13" y="-4" width="14" height="12" rx="2" fill="#17603d"/>
      <circle cx="20" cy="52" r="1.8" fill="#3b2a22"/><circle cx="20" cy="60" r="1.8" fill="#3b2a22"/>
    </g>
  </svg>
  <div class="foot" id="foot">チェックはこの端末のブラウザに保存されます</div>
</div>

<script>
const KEY='sayo-checklist-v1';
const COLORS=['#d62839','#1f8a4c','#e0a106','#2f6fd0','#c2378c'];
const LIGHTC=['#ff4d5e','#ffd23f','#5cc8ff','#ff8fd0','#7dffb0','#fff6c2'];
const HOLLY='<svg class="holly" viewBox="0 0 58 34" aria-hidden="true"><path d="M29 20 C20 4 6 6 2 14 C8 14 8 20 4 24 C12 22 16 28 20 26 C20 22 24 20 29 20Z" fill="#1f8a4c"/><path d="M29 20 C38 4 52 6 56 14 C50 14 50 20 54 24 C46 22 42 28 38 26 C38 22 34 20 29 20Z" fill="#17703f"/><circle cx="25" cy="22" r="5" fill="#d62839"/><circle cx="33" cy="22" r="5" fill="#d62839"/><circle cx="29" cy="15" r="5" fill="#e8304a"/><circle cx="27.5" cy="13.5" r="1.4" fill="#fff" opacity=".7"/></svg>';
const ORN='<svg class="orn" viewBox="0 0 34 38" aria-hidden="true"><circle cx="17" cy="4" r="2.6" fill="none" stroke="#b8860b" stroke-width="1.6"/><rect x="12" y="5.5" width="10" height="6" rx="1.5" fill="#e0a106"/><circle class="ball" cx="17" cy="24" r="12.5"/><ellipse class="shine" cx="12" cy="19" rx="3" ry="4.5" fill="#fff" opacity=".55" transform="rotate(30 12 19)"/><path class="ck" d="M11 24.5l4 4 8-8.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GIFT='<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="13" width="24" height="16" rx="2" fill="#d62839"/><rect x="2" y="9" width="28" height="6" rx="2" fill="#e8304a"/><rect x="14" y="9" width="4" height="20" fill="#ffd23f"/><path d="M16 9 C10 2 5 6 9 9Z M16 9 C22 2 27 6 23 9Z" fill="#ffd23f"/></svg>';
let state={},data=null;
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 雪 */
(function(){
  const box=document.getElementById('snow');if(reduce)return;
  for(let i=0;i<38;i++){
    const f=document.createElement('span');f.className='flake';const s=3+Math.random()*7;
    f.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;opacity:${.45+Math.random()*.5};`+
      `animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*20}s;--dx:${(Math.random()*60-30).toFixed(0)}px`;
    box.appendChild(f);
  }
})();

/* バーの下の電球 */
(function(){
  const b=document.getElementById('bulbs');let h='';
  for(let i=0;i<48;i++)h+=`<span class="bulb" style="--c:${LIGHTC[i%5]};--d:${(i%3)*.6}s"></span>`;
  b.innerHTML=h;
})();

/* ツリーの星 */
(function(){
  const pts=[];for(let k=0;k<10;k++){const a=(-90+k*36)*Math.PI/180,r=k%2?7:16;pts.push((100+r*Math.cos(a)).toFixed(1)+' '+(24+r*Math.sin(a)).toFixed(1))}
  document.getElementById('star').setAttribute('d','M'+pts.join(' L')+'Z');
})();

/* ツリーのライト：チェックの数だけ点く（上から順に） */
const GARLANDS=[[80,70,130],[128,58,142],[168,54,146],[190,38,162]];
function buildLights(n){
  const lens=GARLANDS.map(g=>g[2]-g[1]),tot=lens.reduce((a,b)=>a+b,0);
  let cnt=lens.map(l=>Math.floor(n*l/tot));let rem=n-cnt.reduce((a,b)=>a+b,0);
  lens.map((l,i)=>[n*l/tot-cnt[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(([,i])=>cnt[i]++);
  let w='',l='',idx=0;
  GARLANDS.forEach(([y,x0,x1],gi)=>{
    const cx=(x0+x1)/2,cy=y+14;
    w+=`<path class="wire" d="M${x0} ${y} Q${cx} ${cy} ${x1} ${y}"/>`;
    for(let k=0;k<cnt[gi];k++){
      const t=(k+.5)/cnt[gi],x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,yy=(1-t)*(1-t)*y+2*(1-t)*t*cy+t*t*y;
      l+=`<circle class="lt" data-i="${idx}" cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="5.2" style="--c:${LIGHTC[idx%LIGHTC.length]};--d:${(idx%4)*.5}s"/>`;idx++;
    }
  });
  document.getElementById('wires').innerHTML=w;document.getElementById('lights').innerHTML=l;
}

function render(){
  const m=document.getElementById('main');let h='';
  data.sections.forEach((s,si)=>{
    const c=COLORS[si%COLORS.length];
    h+=`<section class="card" data-s="${s.id}" style="--c:${c}">${HOLLY}<div class="sh"><span class="tag"><i>${si+1}</i>${esc(s.title)}</span><span class="cnt"></span></div><ul>`;
    s.items.forEach(it=>{const k=s.id+'/'+it.id;
      const warn=/要確認/.test(it.note||'')?' warn':'';
      h+=`<li data-k="${k}" class="${state[k]?'on':''}">${ORN}<span class="t">${esc(it.text)}${it.note?`<span class="n${warn}">${esc(it.note)}</span>`:''}</span></li>`});
    h+='</ul></section>';
  });
  const tr=Array.isArray(data.trouble)?data.trouble:(data.trouble?[data.trouble]:[]);
  if(tr.length){
    h+=`<details><summary>${GIFT}困ったとき<span class="pm">＋</span></summary><div class="tr">`;
    tr.forEach(t=>h+=`<div><b>${esc(t.title)}</b><p>${esc(t.text)}</p></div>`);
    h+='</div></details>';
  }
  m.innerHTML=h;
  m.querySelectorAll('li').forEach(li=>li.onclick=()=>{
    const k=li.dataset.k;state[k]=!state[k];if(!state[k])delete state[k];
    li.classList.toggle('on',!!state[k]);
    if(state[k]){li.classList.remove('pop');void li.offsetWidth;li.classList.add('pop')}
    save();count();
  });
  count();
}
function count(){
  let all=0,done=0;
  data.sections.forEach(s=>{let d=0;s.items.forEach(it=>{if(state[s.id+'/'+it.id])d++});all+=s.items.length;done+=d;
    const el=document.querySelector(`section[data-s="${s.id}"] .sh`);
    el.querySelector('.cnt').textContent=d===s.items.length?`★ ${d} / ${s.items.length}`:`${d} / ${s.items.length}`;
    el.classList.toggle('done',d===s.items.length)});
  document.getElementById('fill').style.width=(all?done/all*100:0)+'%';
  document.getElementById('pct').textContent=`${done} / ${all}`;
  document.querySelectorAll('#lights .lt').forEach(c=>c.classList.toggle('on',+c.dataset.i<done));
  const complete=all>0&&done===all;
  document.getElementById('tree').classList.toggle('all',complete);
  document.getElementById('hero').classList.toggle('all',complete);
}
let armT=null;const rb=document.getElementById('reset');
rb.onclick=()=>{
  if(!rb.classList.contains('arm')){rb.classList.add('arm');rb.textContent='もう一度押すとリセット';clearTimeout(armT);armT=setTimeout(()=>{rb.classList.remove('arm');rb.textContent='すべてリセット'},3000);return}
  clearTimeout(armT);rb.classList.remove('arm');rb.textContent='すべてリセット';state={};save();render();scrollTo(0,0);
};
load();
fetch('checklist.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  data=d;
  if(d.title){
    document.title=d.title;
    const mm=d.title.match(/^(.*?)（(.*)）$/);
    document.getElementById('title').textContent=mm?mm[1]:d.title;
    if(mm)document.querySelector('#who span').textContent=mm[2];
  }
  if(d.updated)document.getElementById('foot').textContent='チェックはこの端末のブラウザに保存されます・項目更新 '+d.updated;
  buildLights(d.sections.reduce((a,s)=>a+s.items.length,0));
  render();
}).catch(()=>{document.getElementById('main').innerHTML='<p class="err">項目を読み込めませんでした。再読み込みしてください。</p>'});
</script>
</body>
</html>
